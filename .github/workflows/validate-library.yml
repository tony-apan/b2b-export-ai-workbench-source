name: Validate mother and sub-libraries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-and-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CI structure opt-in: validator invocations skip the three heavyweight WCO
    # regression suites (article-package alone runs ~91s locally / ~150s+ here
    # and would otherwise execute ~8 times across mother structure, sub-library
    # validation, builds, and artifact boundaries — far beyond any job budget).
    # The suites still run exactly once below in the dedicated regression step;
    # formal release/prepare validation always forces the full suites.
    env:
      WCO_CI_SKIP_REGRESSION_SUITES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache-dependency-path: sub-libraries/website-content-ops/ADAPTERS/cms/allincms/package-lock.json

      - name: Run WCO heavyweight regression suites once
        working-directory: sub-libraries/website-content-ops
        run: |
          node --test scripts/sync-workspace-template.test.mjs
          node --test scripts/content-operation-plan.test.mjs
          node --test scripts/article-package.test.mjs

      - name: Run governance negative regression tests
        run: node scripts/run-governance-tests.mjs --timeout-ms 120000

      - name: Validate generated indexes and Markdown metadata
        run: node scripts/validate-indexes.mjs --check

      - name: Validate local Markdown links
        run: node scripts/validate-links.mjs

      - name: Validate stable document IDs
        run: node scripts/validate-document-ids.mjs

      - name: Validate daily event log schema
        run: node scripts/validate-logs.mjs

      - name: Validate raw-to-course knowledge chain
        run: node scripts/validate-knowledge-chain.mjs

      - name: Validate mother library structure
        run: node scripts/validate-mother-library.mjs

      - name: Validate every registered sub-library
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const registry = JSON.parse(fs.readFileSync('sub-libraries/registry.json', 'utf8'));
          for (const entry of registry.entries) {
            cp.execFileSync(process.execPath, [`${entry.path}/scripts/validate-sub-library.mjs`], { stdio: 'inherit' });
          }
          NODE

      - name: Build mother candidate with reproducible timestamp
        env:
          SOURCE_DATE_EPOCH: 0
        run: node scripts/build-mother-release.mjs

      - name: Validate mother artifact boundary
        run: node scripts/validate-artifact.mjs dist/mother/latest

      - name: Build every registered sub-library candidate with reproducible timestamp
        env:
          SOURCE_DATE_EPOCH: 0
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const registry = JSON.parse(fs.readFileSync('sub-libraries/registry.json', 'utf8'));
          for (const entry of registry.entries) {
            const builder = `${entry.path}/scripts/build-release.mjs`;
            // Sub-libraries without a dist pipeline yet (e.g. agency-operations,
            // working-source) have no candidate builder; skip them instead of
            // crashing the registry loop.
            if (!fs.existsSync(builder)) continue;
            cp.execFileSync(process.execPath, [builder], { stdio: 'inherit', env: { ...process.env, SOURCE_DATE_EPOCH: '0' } });
          }
          NODE

      - name: Validate every registered sub-library artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const registry = JSON.parse(fs.readFileSync('sub-libraries/registry.json', 'utf8'));
          for (const entry of registry.entries) {
            const validator = `${entry.path}/scripts/validate-artifact.mjs`;
            if (!fs.existsSync(validator)) continue;
            cp.execFileSync(process.execPath, [validator, `${entry.path}/dist/latest`], { stdio: 'inherit' });
          }
          NODE

      - name: Run adapter tests
        working-directory: sub-libraries/website-content-ops/ADAPTERS/cms/allincms
        run: |
          npm ci
          npm test

  adapter-tests-matrix:
    name: Adapter tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # Line-ending safety is enforced by the repository .gitattributes (all source
      # files eol=lf) plus CRLF normalization in build-interface-index --check and
      # the interface-registry test; this matrix runs the same suite on all three OSes.

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache-dependency-path: sub-libraries/website-content-ops/ADAPTERS/cms/allincms/package-lock.json

      - name: Install and run the full dev suite
        working-directory: sub-libraries/website-content-ops/ADAPTERS/cms/allincms
        run: |
          npm ci
          npm run interfaces:validate
          npm run interfaces:index:check
          npm test
